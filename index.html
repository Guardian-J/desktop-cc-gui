<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/app-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>CC GUI</title>
    <style>
      /* Boot splash + last-resort failure panel. Deliberately dependency-free:
       * these render before the JS bundle loads, so they can't use app CSS or
       * i18n. Colors follow the OS scheme; the real theme takes over on mount.
       * Inline styles are allowed by the packaged CSP (style-src 'unsafe-inline');
       * the watchdog logic lives in public/boot-watchdog.js because script-src
       * does NOT allow inline. */
      #boot-splash {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #6b7280;
      }
      #boot-splash .boot-spinner {
        width: 22px;
        height: 22px;
        border: 2px solid currentColor;
        border-top-color: transparent;
        border-radius: 50%;
        animation: boot-spin 0.7s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      .boot-failure {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        height: 100%;
        padding: 32px;
        box-sizing: border-box;
        text-align: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #111827;
        background: #fff;
      }
      .boot-failure h1 {
        margin: 0;
        font-size: 18px;
        font-weight: 600;
      }
      .boot-failure .boot-failure-reason {
        max-width: 560px;
        margin: 0;
        padding: 12px 16px;
        border-radius: 10px;
        background: #f4f4f5;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        line-height: 1.6;
        color: #dc2626;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .boot-failure .boot-failure-hint {
        margin: 0;
        font-size: 13px;
        color: #6b7280;
      }
      .boot-failure button {
        height: 36px;
        padding: 0 16px;
        border: 0;
        border-radius: 10px;
        background: #18181b;
        color: #fff;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
      }
      .boot-failure button:hover {
        background: #27272a;
      }
      @media (prefers-color-scheme: dark) {
        .boot-failure {
          color: #f4f4f5;
          background: #18181b;
        }
        .boot-failure .boot-failure-reason {
          background: #27272a;
          color: #fca5a5;
        }
        .boot-failure .boot-failure-hint {
          color: #a1a1aa;
        }
        .boot-failure button {
          background: #f4f4f5;
          color: #18181b;
        }
      }
    </style>
  </head>
  <body>
    <!-- Startup placeholder. React replaces everything inside #root on a
     * successful mount and sets data-app-mounted. boot-watchdog.js (loaded
     * before the module bundle) shows the crash reason instead of a silent
     * white screen if the app never gets there. See src/lib/crash.ts for the
     * report format and the other two defence layers. -->
    <div id="root">
      <div id="boot-splash">
        <div class="boot-spinner" aria-hidden="true"></div>
        <span>正在启动 CC GUI…</span>
      </div>
    </div>
    <script src="/boot-watchdog.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
